version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sipakar_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: sipakar
      POSTGRES_PASSWORD: sipakar_secret
      POSTGRES_DB: sipakar_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sipakar_dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipakar -d sipakar_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sipakar_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sipakar.sch.id
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - sipakar_dev_net

volumes:
  postgres_dev_data:

networks:
  sipakar_dev_net:
    driver: bridge
