# ============================================================
# Nginx config untuk VPS (TANPA Docker)
# Simpan ke: /etc/nginx/sites-available/sipakar
# Lalu: ln -s /etc/nginx/sites-available/sipakar /etc/nginx/sites-enabled/
# Dan: nginx -t && nginx -s reload
# ============================================================

server {
    listen 80;
    server_name _;                  # ganti dengan domain/IP jika ada

    # Max upload size
    client_max_body_size 20M;

    # Logging
    access_log /var/log/nginx/sipakar-access.log;
    error_log  /var/log/nginx/sipakar-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Frontend static files ──────────────────────────────
    root /var/www/sipakar;          # atau /root/SIPAKAR/frontend/dist
    index index.html;

    # ── API proxy — /api/* → backend:3001/* ───────────────
    # PENTING: trailing slash di proxy_pass = strip prefix /api
    location /api/ {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 90s;
        proxy_buffering    off;
    }

    # ── Upload files proxy ─────────────────────────────────
    location /uploads/ {
        proxy_pass       http://127.0.0.1:3001/uploads/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Swagger docs ───────────────────────────────────────
    location /api-docs {
        proxy_pass       http://127.0.0.1:3001/api-docs;
        proxy_set_header Host $host;
    }

    # ── SPA fallback (React Router) ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Static assets caching ──────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
